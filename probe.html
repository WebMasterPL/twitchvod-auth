<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sonda zdarzeń embedu — Twitch VOD</title>

<!--
  SONDA ZDARZEŃ INTERAKTYWNEGO EMBEDU

  Po co
  -----
  Chcemy pokazać w aplikacji własny komunikat "wymagana subskrypcja kanału"
  zamiast surowego ekranu Twitcha. Żeby to zrobić, musimy wiedzieć, po czym
  poznać odmowę dostępu.

  Dokumentacja Twitcha wymienia zdarzenia READY, PLAY, PLAYING, PAUSE, ENDED,
  SEEK, ONLINE, OFFLINE, PLAYBACK_BLOCKED, CAPTIONS - i ANI JEDNEGO zdarzenia
  błędu ani uprawnień. Ta strona sprawdza empirycznie, czym różni się przebieg
  zdarzeń dla VOD-a publicznego i dla sub-only bez uprawnień.

  Używa interaktywnego embedu (Twitch.Player), nie gołego iframe - stąd dostęp
  do zdarzeń i metod.

  Jak używać
  ----------
  ?v=NUMER_VODA   - numer z adresu twitch.tv/videos/NUMER

  Uruchom trzy razy i porównaj logi:
    1. VOD publiczny, zalogowany
    2. VOD sub-only z kanału, który subskrybujesz
    3. VOD sub-only z kanału BEZ subskrypcji   <- ten jest najważniejszy

  Zero zależności poza skryptem embedu samego Twitcha.
-->

<style>
  :root { color-scheme: dark; }

  body {
    margin: 0;
    padding: 12px;
    background: #0e0e10;
    color: #efeff1;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 15px; margin: 0 0 8px; }

  #player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid #2a2a30;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  #player iframe { width: 100%; height: 100%; border: 0; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

  button {
    flex: 1 1 auto;
    padding: 10px 12px;
    border: 1px solid #2a2a30;
    border-radius: 8px;
    background: #18181b;
    color: #efeff1;
    font: inherit;
    font-weight: 600;
  }

  button:active { background: #2a2a30; }

  #log {
    background: #18181b;
    border: 1px solid #2a2a30;
    border-radius: 8px;
    padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 220px;
  }

  .t { color: #adadb8; }
  .ev { color: #9147ff; font-weight: 700; }
  .info { color: #efeff1; }
  .warn { color: #f5a623; }
</style>
</head>

<body>
<h1>Sonda zdarzeń embedu</h1>
<div id="player"></div>
<div class="bar">
  <button id="state">Odczytaj stan</button>
  <button id="qualities">Jakości</button>
  <button id="copy">Kopiuj log</button>
</div>
<div id="log"></div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(function () {
  'use strict';

  var PARENT = 'webmasterpl.github.io';
  var logEl = document.getElementById('log');
  var started = Date.now();

  function log(text, cls) {
    var ms = String(Date.now() - started).padStart(6, ' ');
    var line = document.createElement('div');
    line.innerHTML =
      '<span class="t">+' + ms + 'ms </span>' +
      '<span class="' + (cls || 'info') + '">' +
      String(text).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</span>';
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  var params = new URLSearchParams(window.location.search || '');
  var m = /(\d{6,})/.exec((params.get('v') || params.get('video') || '').trim());
  if (!m) {
    log('Brak numeru VOD-a. Dopisz do adresu ?v=123456789', 'warn');
    return;
  }
  var videoId = m[1];

  log('VOD ' + videoId + ', parent ' + PARENT);
  log('Skrypt embedu: ' + (window.Twitch && window.Twitch.Player ? 'zaladowany' : 'BRAK'),
      window.Twitch && window.Twitch.Player ? 'info' : 'warn');

  if (!window.Twitch || !window.Twitch.Player) return;

  var player = new Twitch.Player('player', {
    video: videoId,
    parent: [PARENT],
    width: '100%',
    height: '100%',
    autoplay: true,
    muted: false
  });

  // Wszystkie udokumentowane zdarzenia. Interesuje nas, ktore padaja przy
  // odmowie dostepu - i czy w ogole ktorekolwiek pada.
  ['READY', 'PLAY', 'PLAYING', 'PAUSE', 'ENDED', 'SEEK', 'ONLINE', 'OFFLINE',
   'PLAYBACK_BLOCKED', 'CAPTIONS'].forEach(function (name) {
    var ev = Twitch.Player[name];
    if (ev === undefined) {
      log('zdarzenie ' + name + ' nie istnieje w tej wersji API', 'warn');
      return;
    }
    player.addEventListener(ev, function (payload) {
      var extra = '';
      try {
        if (payload !== undefined) extra = ' ' + JSON.stringify(payload);
      } catch (e) { extra = ' [payload nieserializowalny]'; }
      log(name + extra, 'ev');
    });
  });

  // Niektore bledy embedu lądują tylko w konsoli albo jako postMessage.
  window.addEventListener('message', function (e) {
    if (!/twitch\.tv$/.test(new URL(e.origin).hostname.replace(/^.*?\./, ''))) return;
    var body = typeof e.data === 'string' ? e.data : JSON.stringify(e.data);
    if (body && body.length < 400) log('postMessage: ' + body, 't');
  });

  window.addEventListener('error', function (e) {
    log('window.onerror: ' + (e.message || e.type), 'warn');
  });

  function readState() {
    var out = {};
    ['isPaused', 'getEnded', 'getCurrentTime', 'getDuration', 'getQuality',
     'getMuted', 'getVolume', 'getVideo'].forEach(function (fn) {
      try {
        out[fn] = typeof player[fn] === 'function' ? player[fn]() : '[brak metody]';
      } catch (err) {
        out[fn] = '[wyjatek: ' + err.message + ']';
      }
    });
    log('stan ' + JSON.stringify(out));
  }

  document.getElementById('state').onclick = readState;

  document.getElementById('qualities').onclick = function () {
    try {
      log('getQualities ' + JSON.stringify(player.getQualities()));
    } catch (err) {
      log('getQualities wyjatek: ' + err.message, 'warn');
    }
  };

  document.getElementById('copy').onclick = function () {
    var text = logEl.innerText;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(
        function () { log('log skopiowany do schowka'); },
        function () { log('kopiowanie odrzucone - zaznacz tekst recznie', 'warn'); }
      );
    } else {
      log('brak clipboard API - zaznacz tekst recznie', 'warn');
    }
  };

  // Automatyczny odczyt stanu, zeby zobaczyc roznice miedzy VOD-em, ktory
  // wystartowal, a takim, ktory utknal na odmowie.
  [3000, 8000].forEach(function (delay) {
    setTimeout(function () {
      log('--- automatyczny odczyt po ' + delay / 1000 + 's ---', 't');
      readState();
    }, delay);
  });
})();
</script>
</body>
</html>
